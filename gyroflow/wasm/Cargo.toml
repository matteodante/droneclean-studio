[package]
name = "gyroflow-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gyroflow's stabilization engine (gyroflow-core) as a WebAssembly module"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gyroflow-core = { path = "../src/core" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
serde_json = "1.0"
log = "0.4"

[profile.release]
opt-level = 3

[workspace]
