name: Bug report
description: Something in DroneClean Studio does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app's About box or the release you downloaded.
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where
      options:
        - Desktop app on macOS (Apple silicon)
        - Web editor (droneclean.app/studio)
        - MCP server, with an AI agent
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Import …
        2. …
    validations:
      required: true
  - type: input
    id: footage
    attributes:
      label: Footage
      description: Camera or drone, resolution, frame rate, colour profile. Please do not attach footage you do not want public.
      placeholder: DJI Avata 2, 3840x2880, 59.94 fps, D-Log M
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      render: text
